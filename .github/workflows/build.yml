name: Build Windows Python 3.10 Wheel v3

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing release tag to upload the wheel to, for example v1.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-windows-py310-wheel:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          architecture: "x64"

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gmp
            mingw-w64-x86_64-openssl
            make
            flex
            bison
            wget

      - name: Build PBC library
        shell: msys2 {0}
        run: |
          wget https://crypto.stanford.edu/pbc/files/pbc-1.0.0.tar.gz
          tar -xzf pbc-1.0.0.tar.gz
          cd pbc-1.0.0
          ./configure --prefix=/mingw64 --disable-static --enable-shared --disable-dependency-tracking LDFLAGS="-L/usr/lib"
          make -j$(nproc)
          make install

      - name: Install Python build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install pyparsing

      - name: Configure charm-crypto
        shell: msys2 {0}
        env:
          PYTHON: python
        run: |
          export PATH="/c/hostedtoolcache/windows/Python/3.10.11/x64:/c/hostedtoolcache/windows/Python/3.10.11/x64/Scripts:$PATH"
          ./configure.sh --disable-benchmark

      - name: Build wheel
        shell: msys2 {0}
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
          LANG: "C.UTF-8"
          LC_ALL: "C.UTF-8"
        run: |
          export PATH="/c/hostedtoolcache/windows/Python/3.10.11/x64:/c/hostedtoolcache/windows/Python/3.10.11/x64/Scripts:$PATH"
          python setup.py bdist_wheel --dist-dir wheelhouse
          ls -la wheelhouse

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-py310-wheel
          path: wheelhouse/*.whl

      - name: Upload wheel to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag_name }}
          files: wheelhouse/*.whl
          fail_on_unmatched_files: true
