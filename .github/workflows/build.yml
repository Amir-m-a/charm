name: Build Windows Python 3.10 Wheel

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to upload the wheel to, for example v1.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-windows-py310-wheel:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        architecture: "x64"

    - name: Set up MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-gmp
          mingw-w64-x86_64-openssl
          make
          flex
          bison
          wget

    - name: Build PBC library
      shell: msys2 {0}
      run: |
        wget https://crypto.stanford.edu/pbc/files/pbc-1.0.0.tar.gz
        tar -xzf pbc-1.0.0.tar.gz
        cd pbc-1.0.0

        ./configure --prefix=/mingw64 --disable-static --enable-shared --disable-dependency-tracking LDFLAGS="-L/usr/lib"

        make -j$(nproc)
        make install

    - name: Install Python build dependencies
      shell: pwsh
      run: |
        python -m pip install --upgrade pip setuptools wheel
        python -m pip install pyparsing

    - name: Build Windows Python 3.10 wheel
      shell: pwsh
      run: |
        $env:PATH = "C:\msys64\mingw64\bin;C:\msys64\usr\bin;$env:PATH"
        $env:LAT_MOD = "yes"

        python setup.py bdist_wheel --dist-dir wheelhouse

        Get-ChildItem wheelhouse

    - name: Upload wheel to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag_name }}
        files: wheelhouse/*.whl
        fail_on_unmatched_files: true
